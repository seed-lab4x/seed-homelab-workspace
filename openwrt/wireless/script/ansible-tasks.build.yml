# code: language=ansible
---

- name: wireless.build|build
  delegate_to: localhost
  connection: local
  when:
    - lines | type_debug == 'list'
    - lines | length > 0
  ansible.builtin.copy:
    content: "{{ lines | join(';\n') }};\n"
    dest: "{{ dest }}"
  register: wireless_build
  until: wireless_build is succeeded

- when:
    - lines | type_debug == 'dict'
    - lines.csv is defined
  block:
  - name: wireless.build|read csv file
    delegate_to: localhost
    connection: local
    community.general.read_csv:
      path: "{{ lines.csv }}"
    register: csv_read

  - name: wireless.build|all|fact rendering template
    vars:
      template: "{{ lines.template | default(lines.csv + '.j2',true) }}"
      items: "{{ csv_read.list }}"
      rendered: "{{ lookup('template', template) }}"
    ansible.builtin.set_fact:
      lines_all: "{{ rendered | split('\n') | select() }}"

  - name: wireless.build|build
    delegate_to: localhost
    connection: local
    when:
      - lines_all | type_debug == 'list'
      - lines_all | length > 0
    ansible.builtin.copy:
      content: "{{ lines_all | join(';\n') }};\n"
      dest: "{{ dest }}"
    register: wireless_build
    until: wireless_build is succeeded
