#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: deploy
  hosts: docker
  tasks:

    - name: fact workspace
      include_tasks: "{{ workspace.local }}/.seed/ansible-tasks/seed-workspace.fact.yml"

    - name: fact workpath
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-workpath.fact.yml"

    - name: deploy container
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-container.deploy.yml"
      vars:
        container:
          override: "{{ shadowsocks.libev | default({},true) }}"
          files:
            - path: "{{ workpath.remote.full }}/bind_file-libev.json"
              copy: "{{ playbook_dir }}/../config/libev.json"
          container:
            detach: true
            restart_policy: always
            volumes:
              - "{{ workpath.remote.full }}/bind_file-libev.json:/etc/shadowsocks-libev/config.json"
            network_mode: host
            hostname: shadowsocks
            name: shadowsocks
            image: teddysun/shadowsocks-libev:latest
