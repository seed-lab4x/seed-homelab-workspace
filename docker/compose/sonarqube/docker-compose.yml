version: "3.8"

volumes:
  data:
    name: external_vol-sonarqube-data
    external: true
  logs:
    name: external_vol-sonarqube-logs
    external: true
  extensions:
    name: external_vol-sonarqube-extensions
    external: true

services:
  sonarqube:
    image: sonarqube:10.4.1-community
    env_file: external_env-all.env
    # environment:
    #   SONAR_JDBC_URL: jdbc:postgresql://pgsql:5432/sonar
    #   SONAR_JDBC_USERNAME: sonar
    #   SONAR_JDBC_PASSWORD: sonar
    ports:
      - 9100:9000
    volumes:
      - data:/opt/sonarqube/data
      - logs:/opt/sonarqube/logs
      - extensions:/opt/sonarqube/extensions
    container_name: sonarqube
    restart: always
    # healthcheck:
    #   test: curl -f http://localhost:9000 || exit 1
    #   interval: 60s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 10m