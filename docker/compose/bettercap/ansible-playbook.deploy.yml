#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: deploy
  hosts: docker
  tasks:

    - name: fact workspace
      include_tasks: "{{ workspace.local }}/.seed/ansible-tasks/seed-workspace.fact.yml"

    - name: fact workpath
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-workpath.fact.yml"

    - name: deploy compose
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-compose.deploy.yml"
      vars:
        compose:
          override: "{{ bettercap | default({},true) }}"
          files:
            - path: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/"
            - path: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/caplets/http-ui-service.cap"
              copy: "{{ playbook_dir }}/caplets/http-ui-service.cap"
            - path: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/caplets/http-service.cap"
              copy: "{{ playbook_dir }}/caplets/http-service.cap"
          volumes:
            - name: external_vol-bettercap-usr
              driver: local
              push:
                - dest: "./"
                  src: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/"
            - name: external_vol-bettercap-home
              driver: local
          envs:
            - file: external_env-all.env
              content: ''
          composes:
            - file: docker-compose.yml
              template: "{{ playbook_dir }}/docker-compose.yml"
            - file: docker-compose@network.yml
              template: "{{ playbook_dir }}/docker-compose@network.yml"
