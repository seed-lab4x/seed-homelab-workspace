#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: deploy
  hosts: docker
  tasks:

    - name: fact workspace
      include_tasks: "{{ workspace.local }}/.seed/ansible-tasks/seed-workspace.fact.yml"

    - name: fact workpath
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-workpath.fact.yml"

    - name: deploy compose
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-compose.deploy.yml"
      vars:
        compose:
          vars: "{{ bettercap | default({},true) }}"
          default:
            files:
              - dest: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/"
              - dest: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/caplets/http-ui-service.cap"
                src: "{{ playbook_dir }}/caplets/http-ui-service.cap"
            volumes:
              - name: external_vol-bettercap-usr
                driver: local
                push:
                  - dest: "./"
                    src: "{{ workpath.remote.full }}/usr/external_vol-bettercap-usr/"
              - name: external_vol-jenkins-home
                driver: local
            envs:
              - file: external_env-all.env
                content: ''
            composes:
              - file: docker-compose.yml
                template: "{{ playbook_dir }}/docker-compose.yml"
              - file: docker-compose@network.yml
                template: "{{ playbook_dir }}/docker-compose@network.yml"
