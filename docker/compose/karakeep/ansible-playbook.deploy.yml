#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: deploy
  hosts: docker
  tasks:

    - name: fact workspace
      include_tasks: "{{ workspace.local }}/.seed/ansible-tasks/seed-workspace.fact.yml"

    - name: fact workpath
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-workpath.fact.yml"

    - name: deploy compose
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-compose.deploy.yml"
      vars:
        compose:
          name: karakeep
          vars: "{{ karakeep | default({},true) }}"
          default:
            volumes:
              - name: external_vol-karakeep-data
                driver: local
              - name: external_vol-karakeep-meilisearch
                driver: local
            envs:
              - file: external_env-karakeep.env
                content: |
                  NEXTAUTH_SECRET=super_random_string
                  MEILI_MASTER_KEY=another_random_string
                  NEXTAUTH_URL=http://localhost:3000
              - file: external_env-chrome.env
                content: ''
              - file: external_env-meilisearch.env
                content: ''
            composes:
              - file: docker-compose.yml
                template: "{{ playbook_dir }}/docker-compose.yml"
