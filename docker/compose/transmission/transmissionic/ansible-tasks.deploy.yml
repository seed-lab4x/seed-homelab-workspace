# code: language=ansible
---

- rescue:
  - name: transmission-transmissionic.deploy|rescue|fail tasks
    when:
      - transmissionic | default(None) != None
    ansible.builtin.fail:
      msg: "deploy transmissionic fail. exclude attr undefined."

  block:
  - name: transmission-transmissionic.deploy|assert defined
    ansible.builtin.assert:
      that:
        - transmissionic | default(None) != None
      msg: "var eval fail {{ transmissionic }}"
      quiet: true

  - name: transmission-transmissionic.deploy|get latest
    when: transmissionic.url is undefined
    ansible.builtin.uri:
      url: "https://api.github.com/repos/6c65726f79/Transmissionic/releases/latest"
      return_content: true
    register: transmissionic_latest_get

  - name: transmission-transmissionic.deploy|fact param
    vars:
      version: "{{ transmissionic_latest_get.json.name | default('v1.8.0',true) }}"
      default:
        # url(cloud) -> cache(local) -> file(remote) -> path(remote)
        url: "https://github.com/6c65726f79/Transmissionic/releases/download/{{ version }}/Transmissionic-webui-{{ version }}.zip"
        cache: "~/.transmission/Transmissionic-webui-{{ version }}.zip"
        file: "~/.transmission/Transmissionic-webui-{{ version }}.zip"
        path: "~/.transmission/Transmissionic-webui-{{ version }}"
    ansible.builtin.set_fact:
      _transmissionic: "{{ default | combine(transmissionic, recursive=True) }}"

  - name: transmission-transmissionic.deploy|stat file
    ansible.builtin.stat:
      path: "{{ _transmissionic.file }}"
    register: transmissionic_file_stat

  - when: not transmissionic_file_stat.stat.exists
    block:
    - name: transmission-transmissionic.deploy|mkdir cache
      delegate_to: localhost
      ansible.builtin.file:
        state: directory
        path: "{{ _transmissionic.cache | dirname }}"

    - name: transmission-transmissionic.deploy|curl cache
      delegate_to: localhost
      ansible.builtin.get_url:
        dest: "{{ _transmissionic.cache }}"
        url: "{{ _transmissionic.url }}"

    - name: transmission-transmissionic.deploy|mkdir file
      ansible.builtin.file:
        state: directory
        path: "{{ _transmissionic.file | dirname }}"

    - name: transmission-transmissionic.deploy|copy file
      ansible.builtin.copy:
        dest: "{{ _transmissionic.file }}"
        src: "{{ _transmissionic.cache }}"

  - name: transmission-transmissionic.deploy|mkdir path
    ansible.builtin.file:
      state: directory
      path: "{{ _transmissionic.path }}"

  - name: transmission-transmissionic.deploy|unzip file
    ansible.builtin.unarchive:
      dest: "{{ _transmissionic.path }}"
      src: "{{ _transmissionic.file }}"

  - name: transmission-transmissionic.deploy|push volume
    include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-volumes.push.yml"
    vars:
      volumes:
        - name: external_vol-transmission-config
          remote_src: true
          src: "{{ _transmissionic.path }}/web/"
          dest: "./webui/transmissionic/"
          bind: true
          directory_mode: '0777'

  - name: transmission-transmissionic.deploy|remove path
    ansible.builtin.file:
      state: absent
      path: "{{ _transmissionic.path }}"
