version: "3.8"

volumes:
  data:
    name: external_vol-uptime-kuma
    external: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    env_file: external_env-all.env
    volumes:
      - data:/app/data
    ports:
      - 3001
    # network_mode: bridge
    container_name: uptime-kuma
    restart: always
    # healthcheck:
    #   test: nc -z localhost 3001 || nc -z 127.0.0.1 3001 || exit 1
    #   interval: 60s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 10m
