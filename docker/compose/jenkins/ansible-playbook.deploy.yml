#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: deploy
  hosts: docker
  tasks:

    - name: fact workspace
      include_tasks: "{{ workspace.local }}/.seed/ansible-tasks/seed-workspace.fact.yml"

    - name: fact workpath
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-workpath.fact.yml"

    - name: deploy compose
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-compose.deploy.yml"
      vars:
        compose:
          override: "{{ jenkins | default({},true) }}"
          files:
            - dest: "{{ workpath.remote.full }}/config"
              src: "{{ playbook_dir }}/config/"
            - dest: "{{ workpath.remote.full }}/plugin/external_vol-jenkins-plugin/"
          volumes:
            - name: external_vol-jenkins-var
              driver: local
              push:
                - dest: "./"
                  mode: 777
                - dest: "./jenkins.yml"
                  src: "{{ workpath.remote.full }}/config/jenkins.yml"
            - name: external_vol-jenkins-ref
              driver: local
              # push:
              #   - dest: "./jenkins.install.UpgradeWizard.state"
              #     src: "{{ workpath.remote.full }}/config/jenkins.install.UpgradeWizard.state"
            - name: external_vol-jenkins-plugin
              driver: local
              push:
                - dest: "./"
                  src: "{{ workpath.remote.full }}/plugin/external_vol-jenkins-plugin/"
            - name: external_vol-jenkins-home
              driver: local
          envs:
            - file: external_env-all.env
              content: 
                CASC_JENKINS_CONFIG=/var/jenkins_home/jenkins.yaml
          composes:
            - file: docker-compose.yml
              template: "{{ playbook_dir }}/docker-compose.yml"
