  #     numExecutors: 49
  #     remoteFS: "/home/jenkins_remote"
  #     retentionStrategy: "always"
  # /manage/configure
  # 执行器数量
  numExecutors: 0
  # /view/all/
  primaryView:
    all:
      name: "all"
  # /manage/configure
  # 工程命名限制
  projectNamingStrategy: "standard"
  # /manage/configure
  # 静默期
  quietPeriod: 5
  # https://www.jenkins.io/doc/book/security/controller-isolation/jep-235/
  remotingSecurity:
    enabled: true
  # /manage/configure
  # SCM签出重试次数
  scmCheckoutRetryCount: 0
  # /manage/configure
  # 标签
  labelString: ""
  # /manage/configureSecurity/
  # Authentication -> 安全域
  securityRealm:
    local:
      allowsSignup: true
      enableCaptcha: false
      users:
      - id: "admin"
        name: "admin"
        properties:
        - "apiToken"
        - "userCommunityProperty"
        - "consoleUrlProvider"
        - "mailer"
        - "myView"
        - preferredProvider:
            providerId: "default"
        - "timezone"
        - "experimentalFlags"
      - id: "jenkins"
        name: "jenkins"
        password: jenkins.123
        properties:
        - "apiToken"
        - "userCommunityProperty"
        - "consoleUrlProvider"
        - "myView"
        - preferredProvider:
            providerId: "default"
        - "timezone"
        - "experimentalFlags"
        - mailer:
            emailAddress: "jenkins@mail.lan"
  # /manage/configureSecurity/
  # 代理 代理端口
  slaveAgentPort: 50000
  # /manage/configure
  systemMessage: "**Self-registered users**\r\n\
    \r\n\
    - user:password \
    \ `jenkins:jenkins.123`\r\n\
    \r\n"
  # /manage/pluginManager/advanced
  # 升级站点
  updateCenter:
    sites:
    - id: "default"
      url: "https://updates.jenkins.io/update-center.json"
  # /view/all/
  views:
  - all:
      name: "all"
  # need https://plugins.jenkins.io/dashboard-view/
  - dashboard:
      bottomPortlets:
      - statBuilds:
          name: "Build statistics"
      - statJobs:
          name: "Job statistics"
      - statSlaves:
          name: "Agent statistics"
      columns:
      - "status"
      - "weather"
      - "jobName"
      - "lastSuccess"
      - "lastFailure"
      - "lastDuration"
      - "buildButton"
      # - "builtOnColumn"
      # - "coverageColumn"
      includeRegex: ".*"
      name: "statistics"
      recurse: true
      topPortlets:
      - latestBuilds:
          name: "Latest builds"
          numBuilds: 10
      - unstableJobsPortlet:
          name: "Unstable Jobs"
          recurse: false
          showOnlyFailedJobs: false
  # /view/all/
  viewsTabBar: "standard"

# jenkins core
# /manage/configureCredentials/
# 凭据提供者配置
globalCredentialsConfiguration:
  configuration:
    providerFilter: "none"
    typeFilter: "none"

# jenkins core
# /manage/appearance/
# Appearance
appearance:
  prism:
    theme: PRISM

security:
  # jenkins core
  # /manage/configureSecurity/
  # API Token
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
  # https://plugins.jenkins.io/copyartifact/
  # /manage/configureSecurity/
  # Copy Artifact
  copyartifact:
    mode: MIGRATION
  # https://plugins.jenkins.io/git/
  # /manage/configureSecurity/
  # Git Hooks
  gitHooks:
    allowedOnAgents: false
    allowedOnController: false
  # https://plugins.jenkins.io/git-client/
  # /manage/configureSecurity/
  # Git Host Key Verification Configuration
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "knownHostsFileVerificationStrategy"
  # https://plugins.jenkins.io/job-dsl/
  # Enable script security for Job DSL scripts
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
  # jenkins core
  # /manage/configureSecurity/
  # Access Control for Builds
  queueItemAuthenticator:
    authenticators:
    - global:
        strategy: "systemAuthorizationStrategy"
  # https://plugins.jenkins.io/sshd/
  # /manage/configureSecurity/
  # SSH Server
  sSHD:
    port: -1
  # https://plugins.jenkins.io/script-security/
  # /manage/scriptApproval/
  scriptApproval:
    approvedSignatures:
    - "method groovy.lang.GroovyObject getProperty java.lang.String"
    - "method groovy.lang.GroovyObject invokeMethod java.lang.String java.lang.Object"
    - "method hudson.model.Cause$UpstreamCause getUpstreamProject"
    - "method hudson.model.ItemGroup getItem java.lang.String"
    - "method hudson.model.Run getCause java.lang.Class"
    - "method hudson.plugins.git.BranchSpec getName"
    - "method hudson.plugins.git.GitSCM getBranches"
    - "method hudson.plugins.git.GitSCM getUserRemoteConfigs"
    - "method hudson.plugins.git.UserRemoteConfig getCredentialsId"
    - "method hudson.plugins.git.UserRemoteConfig getUrl"
    - "method java.io.File exists"
    - "method java.io.File getAbsolutePath"
    - "method java.io.File getName"
    - "method java.io.File isDirectory"
    - "method java.io.File isHidden"
    - "method java.io.File listFiles"
    - "method org.jenkinsci.plugins.workflow.support.steps.build.RunWrapper getRawBuild"
    - "new groovy.util.AntBuilder"
    - "new java.io.File java.lang.String"
    - "staticMethod jenkins.model.Jenkins get"
    - "staticMethod jenkins.model.Jenkins getInstance"
    - "staticMethod org.codehaus.groovy.runtime.DefaultGroovyMethods renameTo java.io.File java.lang.String"
    - "staticMethod org.codehaus.groovy.runtime.DefaultGroovyMethods reverse java.util.List"
    - "staticMethod org.codehaus.groovy.runtime.DefaultGroovyMethods getAt java.lang.Object java.lang.String"

unclassified:
  # https://plugins.jenkins.io/build-discarder/
  # /manage/configure
  # Global Build Discarders
  buildDiscarders:
    configuredBuildDiscarders:
    - "jobBuildDiscarder"
    - simpleBuildDiscarder:
        discarder:
          logRotator:
            artifactDaysToKeepStr: "30"
            artifactNumToKeepStr: "60"
            daysToKeepStr: "30"
            numToKeepStr: "60"
  # https://plugins.jenkins.io/build-timeout/
  # /manage/configure
  # Build-timeout Plugin > BuildStep Action
  buildStepOperation:
    enabled: false
  # https://plugins.jenkins.io/email-ext/
  # /manage/configure
  # Extended E-mail Notification
  email-ext:
    adminRequiredForTemplateTesting: false
    allowUnregisteredEnabled: false
    charset: "UTF-8"
    debugMode: false
    defaultBody: |-
      $PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS:

      Check console output at $BUILD_URL to view the results.
    defaultContentType: "text/plain"
    defaultSubject: "$PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS!"
    defaultTriggerIds:
    - "hudson.plugins.emailext.plugins.trigger.FailureTrigger"
    maxAttachmentSize: -1
    maxAttachmentSizeMb: -1
    precedenceBulk: false
    watchingEnabled: false
  # https://plugins.jenkins.io/gradle/
  # /manage/configure
  # Develocity Build Scans
  enrichedSummaryConfig:
    enrichedSummaryEnabled: false
    httpClientDelayBetweenRetriesInSeconds: 1
    httpClientMaxRetries: 3
    httpClientTimeoutInSeconds: 1
  # jenkins core
  # /manage/configure
  # Fingerprints
  fingerprints:
    fingerprintCleanupDisabled: false
    storage: "file"
  # https://plugins.jenkins.io/github-branch-source/
  # /manage/configure
  # GitHub API usage
  gitHubConfiguration:
    apiRateLimitChecker: ThrottleForNormalize
  # https://plugins.jenkins.io/github/
  # /manage/configure
  # GitHub
  # gitHubPluginConfig:
  #   hookUrl: "http://jenkins.home/github-webhook/"
  # https://plugins.jenkins.io/gitlab-plugin/
  # /manage/configure
  # GitLab
  gitLabConnectionConfig:
    connections:
    - apiTokenId: "admin@token.gitlab.home"
      clientBuilderId: "autodetect"
      connectionTimeout: 10
      ignoreCertificateErrors: false
      name: "default"
      readTimeout: 10
      url: "http://gitlab.lan"
    useAuthenticatedEndpoint: true
  # https://plugins.jenkins.io/build-timeout/
  # /manage/configure
  # Global Build Time Out
  globalTimeOutConfiguration:
    operations:
    - "abortOperation"
    overwriteable: false
  # https://plugins.jenkins.io/gradle/
  # /manage/configure
  # Develocity integration
  injectionConfig:
    allowUntrusted: false
    checkForBuildAgentErrors: false
    enabled: false
    enforceUrl: false
    injectCcudExtension: false
    injectMavenExtension: false
  # https://plugins.jenkins.io/cloudbees-folder/
  # Folder
  defaultFolderConfiguration:
    healthMetrics:
    - worstChildHealthMetric:
        recursive: true
  # https://plugins.jenkins.io/junit/
  junitTestResultStorage:
    storage: "file"
  # jenkins core
  # /manage/configure
  # Jenkins Location
  location:
    adminAddress: "NONE <nobody@nowhere>"
    url: "http://jenkins.home/"
  # https://plugins.jenkins.io/mailer/
  # /manage/configure
  # 邮件通知
  mailer:
    charset: "UTF-8"
    useSsl: false
    useTls: false
  # https://plugins.jenkins.io/maven-plugin
  # /manage/configure
  # Maven项目配置
  mavenModuleSet:
    localRepository: "default"
  #
  pollSCM:
    pollingThreadCount: 10
  # https://plugins.jenkins.io/git/
  # /manage/configure
  # Git plugin
  scmGit:
    addGitTagAction: false
    allowSecondFetch: false
    createAccountBasedOnEmail: false
    disableGitToolChooser: false
    hideCredentials: false
    showEntireCommitSummaryInChanges: false
    useExistingAccountWithSameEmail: false
  # https://plugins.jenkins.io/sonar/
  # /manage/configure
  # SonarQube servers
  # sonarGlobalConfiguration:
  #   buildWrapperEnabled: true
  #   installations:
  #   - credentialsId: "secret.sonarqube.home"
  #     name: "default"
  #     serverUrl: "http://sonarqube.home"
  #     triggers:
  #       skipScmCause: false
  #       skipUpstreamCause: false
  # https://plugins.jenkins.io/publish-over-ssh/
  # /manage/configure
  # Publish over SSH
  sshPublisher:
    commonConfig:
      disableAllExec: false
      encryptedPassphrase: ""
  # https://plugins.jenkins.io/subversion/
  # /manage/configure
  # Subversion
  subversionSCM:
    workspaceFormat: 8
  # https://plugins.jenkins.io/timestamper/
  # /manage/configure
  # Timestamper
  timestamper:
    allPipelines: false
    elapsedTimeFormat: "'<b>'HH:mm:ss.S'</b> '"
    systemTimeFormat: "'<b>'HH:mm:ss'</b> '"
  # https://plugins.jenkins.io/copyartifact/
  # /manage/configure
  # Copyartifact: Upstream build that triggered this job
  upstream:
    globalUpstreamFilterStrategy: UseOldest

