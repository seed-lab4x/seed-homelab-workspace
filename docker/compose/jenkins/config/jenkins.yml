# /manage/configure
jenkins:
  # /manage/configureSecurity/
  # 代理 -> 代理协议
  agentProtocols:
  - "JNLP4-connect"
  - "Ping"
  # /manage/configureSecurity/
  # Authentication -> 授权策略
  authorizationStrategy:
    projectMatrix:
      entries:
      - group:
          name: "authenticated"
          permissions:
          - "Credentials/Create"
          - "Credentials/View"
          - "Job/Build"
          - "Job/Cancel"
          - "Job/Create"
          - "Job/Discover"
          - "Job/Read"
          - "Job/Workspace"
          - "Overall/Read"
          - "Run/Replay"
          - "View/Create"
          - "View/Read"
      - user:
          name: "anonymous"
          permissions:
          - "Overall/Read"
          - "Job/Discover"
          - "Job/Read"
          - "View/Read"
      - userOrGroup:
          name: "admin"
          permissions:
          - "Agent/Build"
          - "Agent/Configure"
          - "Agent/Connect"
          - "Agent/Create"
          - "Agent/Delete"
          - "Agent/Disconnect"
          - "Credentials/Create"
          - "Credentials/Delete"
          - "Credentials/ManageDomains"
          - "Credentials/Update"
          - "Credentials/View"
          - "Job/Build"
          - "Job/Cancel"
          - "Job/Configure"
          - "Job/Create"
          - "Job/Delete"
          - "Job/Discover"
          - "Job/Move"
          - "Job/Read"
          - "Job/Workspace"
          - "Overall/Administer"
          - "Overall/Read"
          - "Run/Delete"
          - "Run/Replay"
          - "Run/Update"
          - "SCM/Tag"
          - "View/Configure"
          - "View/Create"
          - "View/Delete"
          - "View/Read"
          - "Lockable Resources/Queue"
          - "Lockable Resources/Reserve"
          - "Lockable Resources/Steal"
          - "Lockable Resources/Unlock"
          - "Lockable Resources/View"
      - user:
          name: "jenkins"
          permissions:
          - "Overall/Read"
          - "Agent/Build"
          - "Agent/Connect"
          - "Agent/Create"
          - "Credentials/Create"
          - "Credentials/ManageDomains"
          - "Credentials/View"
          - "Job/Build"
          - "Job/Cancel"
          - "Job/Create"
          - "Job/Discover"
          - "Job/Read"
          - "Job/Workspace"
          - "Run/Replay"
          - "SCM/Tag"
          - "View/Create"
          - "View/Read"
  # /manage/configureSecurity/
  # 跨站请求伪造保护
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false
  # /manage/configureSecurity/
  # Authentication -> 不要记住我
  disableRememberMe: false
  #
  disabledAdministrativeMonitors:
  - "hudson.util.DoubleLaunchChecker"
  # /label/built-in/
  labelAtoms:
  - name: "built-in"
  - name: "docker"
  - name: "linux"
  - name: "jenkins01"
  # /manage/configureSecurity/
  # 标记格式器
  # need https://plugins.jenkins.io/markdown-formatter/
  markupFormatter: "markdownFormatter"
  # /manage/configure
  # 用法
  mode: EXCLUSIVE
  # /me/my-views/view/all/
  myViewsTabBar: "standard"
  # /manage/computer/configure
  nodeMonitors:
  - "architecture"
  - "clock"
  - diskSpace:
      freeSpaceThreshold: "1GiB"
      freeSpaceWarningThreshold: "2GiB"
  - "swapSpace"
  - tmpSpace:
      freeSpaceThreshold: "1GiB"
      freeSpaceWarningThreshold: "2GiB"
  - "responseTime"
  # /manage/computer/
  nodes:
  # - permanent:
  #     labelString: "linux docker"
  #     launcher:
  #       ssh:
  #         credentialsId: "ubuntu@passwd.jenkins.server"
  #         host: "jenkins01.lan"
  #         javaPath: "/usr/bin/java"
  #         port: 22
  #         sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
  #     mode: NORMAL
  #     name: "jenkins01"
  #     nodeProperties:
  #     - toolLocation:
  #         locations:
  #         - home: "git"
  #           key: "hudson.plugins.git.GitTool$DescriptorImpl@Default"
  #         - home: "/home/ubuntu/.sdkman/candidates/java/8.0.265-open"
  #           key: "hudson.model.JDK$DescriptorImpl@8"
  #         - home: "/home/ubuntu/.sdkman/candidates/java/17.0.5-tem"
  #           key: "hudson.model.JDK$DescriptorImpl@17"
  #         - home: "/home/ubuntu/.sdkman/candidates/gradle/6.5"
  #           key: "hudson.plugins.gradle.GradleInstallation$DescriptorImpl@6.5"
  #         - home: "/home/ubuntu/.sdkman/candidates/gradle/7.6"
  #           key: "hudson.plugins.gradle.GradleInstallation$DescriptorImpl@7.6"
  #         - home: "/home/ubuntu/.sdkman/candidates/maven/3.6.3"
  #           key: "hudson.tasks.Maven$MavenInstallation$DescriptorImpl@3.6.3"
  #         - home: "/home/ubuntu/.sdkman/candidates/maven/3.8.7"
  #           key: "hudson.tasks.Maven$MavenInstallation$DescriptorImpl@3.8.7"
  #         - home: "/home/ubuntu/.nvm/versions/node/v16.19.0"
  #           key: "jenkins.plugins.nodejs.tools.NodeJSInstallation$DescriptorImpl@16.19.0"
  #         - home: "/home/ubuntu/.nvm/versions/node/v18.13.0"
  #           key: "jenkins.plugins.nodejs.tools.NodeJSInstallation$DescriptorImpl@18.13.0"
  #         - home: "/home/ubuntu/.pyenv/versions/3.8.13/bin/python"
  #           key: "jenkins.plugins.shiningpanda.tools.PythonInstallation$DescriptorImpl@3.8.13"
  #         - home: "/home/ubuntu/.pyenv/versions/3.10.3/bin/python"
  #           key: "jenkins.plugins.shiningpanda.tools.PythonInstallation$DescriptorImpl@3.10.3"
  #         - home: "/home/ubuntu/.sonar_scanner/sonar-scanner-5.0.1.3006-linux"
