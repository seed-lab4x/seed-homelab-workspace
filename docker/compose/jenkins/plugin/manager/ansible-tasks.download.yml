# code: language=ansible
---

- name: jenkins-plugin-manager.download|download tool
  include_tasks:
    file: tool/ansible-tasks.download.yml
    apply:
      delegate_to: localhost

- name: jenkins-plugin-manager.download|deploy container
  include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-container.deploy.yml"
  vars:
    container:
      override: "{{ _plugin.override.container | default({},true) }}"
      files:
        - dest: "{{ _plugin.directory }}"
          mode: "0777"
        - dest: "{{ workpath.remote.full }}/bind_file-plugins.yml"
          src: "{{ _plugin.file }}"
        - dest: "{{ workpath.remote.full }}/bind_file-{{ _manager.name }}"
          src: "{{ _manager.dest }}"
      volumes:
        - name: "{{ _plugin.volume }}"
          driver: local
          driver_options:
            type: none
            device: "{{ _plugin.directory }}"
            o: bind
      envs:
        - file: external_env-all.env
          content: ''
      container:
        detach: false
        volumes:
          - "{{ _plugin.volume }}:/plugins"
          - "{{ workpath.remote.full }}/bind_file-plugins.yml:/usr/share/jenkins/ref/plugins.yml"
          - "{{ workpath.remote.full }}/bind_file-{{ _manager.name }}:/opt/jenkins-plugin-manager.jar"
        command: >
          java
          -jar /opt/jenkins-plugin-manager.jar
          --jenkins-version {{ _plugin.version }}
          --plugin-file /usr/share/jenkins/ref/plugins.yml
          --plugin-download-directory /plugins
          {{ _plugin.flags }}
        user: "1000:1000"
        env_file: "{{ workpath.remote.full }}/external_env-all.env"
        hostname: "{{ _plugin.container }}"
        name: "{{ _plugin.container }}"
        image: "{{ _plugin.image }}"

- name: jenkins-plugin-manager.download|remove container
  when: _plugin.container is regex('^anonymous_.*')
  community.docker.docker_container:
    name: "{{ _plugin.container }}"
    state: absent
    keep_volumes: false

- name: jenkins-plugin-manager.download|remove volume
  when: _plugin.volume is regex('^anonymous_.*')
  community.docker.docker_volume:
    name: "{{ _plugin.volume }}"
    state: absent
