version: "3.8"

volumes:
  data:
    name: external_vol-jenkins-data
    external: true
  ref:
    name: external_vol-jenkins-ref
    external: true
  plugin:
    name: external_vol-jenkins-plugin
    external: true
  home:
    name: external_vol-jenkins-home
    external: true

services:
  jenkins:
    image: jenkins/jenkins:2.440.2-jdk17
    env_file: external_env-all.env
    # environment:
    #   DOCKER_TLS_CERTDIR: /certs
    #   JENKINS_UC: https://mirrors.tuna.tsinghua.edu.cn/jenkins/updates/dynamic-stable-2.440.2/update-center.actual.json
    ports:
      - 8780:8080
      - 50000:50000
    volumes:
      - data:/var/jenkins_home
      - ref:/usr/share/jenkins/ref
      - plugin:/usr/share/jenkins/ref/plugins
      - home:/home/jenkins
    container_name: jenkins
    restart: always
    # healthcheck:
    #   test: curl -f http://localhost:8080 || exit 1
    #   interval: 60s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 10m