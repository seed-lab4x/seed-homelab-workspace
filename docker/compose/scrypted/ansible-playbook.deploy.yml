#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: deploy
  hosts: docker
  tasks:

    - name: fact workspace
      include_tasks: "{{ workspace.local }}/.seed/ansible-tasks/seed-workspace.fact.yml"

    - name: fact workpath
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-workpath.fact.yml"

    - name: deploy compose
      include_tasks: "{{ workspace.local }}/{{ workspace.seedpath }}/ansible-tasks/seed-docker/docker-compose.deploy.yml"
      vars:
        compose:
          override: "{{ scrypted | default({},true) }}"
          volumes:
            - name: external_vol-scrypted-nvr
              driver: local
            - name: external_vol-scrypted-volume
              driver: local
          envs:
            - file: external_env-scrypted.env
              content: ''
          composes:
            - file: docker-compose.yml
              template: "{{ playbook_dir }}/docker-compose.yml"
