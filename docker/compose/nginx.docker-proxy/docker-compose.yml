version: "3.8"

networks:
  nginx:

volumes:
  etc:
    name: external_vol-nginx-etc
    external: true

services:
  nginx:
    image: nginxproxy/nginx-proxy:1.6
    env_file: external_env-all.env
    volumes:
      # - ./bind_file-nginx.conf:/etc/nginx/nginx.conf
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - etc:/etc/nginx/conf.d
    networks:
      - nginx
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    # network_mode: "host"
    container_name: nginx
    restart: always
