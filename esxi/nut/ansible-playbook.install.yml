#!/usr/bin/env -S ansible-playbook -i ${PWD}/ansible-inventories
# code: language=ansible
---

- name: install
  hosts: esxi
  tasks:

    - name: install upsmon
      include_tasks: ansible-tasks.install.yml
      vars:
        install:
          url: "{{ nut.install.url | default(None) }}"
          mode: "{{ nut.install.mode | default(None) }}"

    - name: print upsmon status
      vars:
        esxi_hostvars: "{{ hostvars | dict2items
          | selectattr('key','in',ansible_play_hosts)
          | selectattr('value.upsmon_package_install','defined') }}"
      ansible.builtin.pause:
        seconds: 1
        prompt: |
          {% for host in esxi_hostvars %}

          [{{ host.key }}] =>
          --------------------------------------------------
          {{ host.value.upsmon_package_install.stdout | default('',true) }}
          {{ host.value.upsmon_package_install.stderr | default('',true) }}
          {% endfor %}
