# code: language=ansible
---

- rescue:
  - name: upsmon.config|rescue|fail tasks
    when:
      - vmware is defined
    ansible.builtin.fail:
      msg: "config upsmon fail. exclude var undefined."

  block:
  - name: upsmon.config|assert var
    ansible.builtin.assert:
      that:
        - vmware is defined
      msg: "var eval fail {{ vmware }}"
      quiet: true

  - name: upsmon.config|set upsmon
    loop:
      - esxcli system settings advanced set -o "/UserVars/NutUpsName" --string-value "{{ config.upsname | default('upsname@nutserver',true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutUser" --string-value "{{ config.user | default('upsuser',true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutPassword" --string-value "{{ config.password | default('upspassword',true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutFinalDelay" --int-value "{{ config.finaldelay | default(5,true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutOnBatteryDelay" --int-value "{{ config.onbatterydelay | default(0,true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutSendMail" --int-value "{{ config.sendmail | default(0,true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutMailTo" --string-value "{{ config.mailto | default('root@domain',true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutMinSupplies" --int-value "{{ config.minsupplies | default(1,true) }}"
      - esxcli system settings advanced set -o "/UserVars/NutSmtpRelay" --string-value "{{ config.smtprelay | default('',true) }}"
    ansible.builtin.shell:
      cmd: "{{ item }}"
    register: upsmon_esxcli_config

  - name: upsmon.config|on service policy
    delegate_to: localhost
    community.vmware.vmware_host_service_manager:
      hostname: "{{ vmware.hostname }}"
      username: "{{ vmware.username }}"
      password: "{{ vmware.password }}"
      validate_certs: false
      esxi_hostname: '{{ vmware.hostname }}'
      service_name: NutClient
      service_policy: on
      state: present

  - name: upsmon.config|restart upsmon service
    ansible.builtin.shell:
      cmd: "/etc/init.d/upsmon restart"
    register: upsmon_service_restart

  - name: upsmon.config|test upsmon server
    ansible.builtin.shell:
      cmd: "/opt/nut/bin/upsc {{ config.upsname | default('upsname@nutserver',true) }}"
    register: upsmon_package_config
    failed_when: false
