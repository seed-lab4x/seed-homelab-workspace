# code: language=ansible
---

- name: seed-workspace.init|fact param
  vars:
    workspace_optional:
      package:
        - sshpass
        - rsync
        - git
        - zip
      pip:
        - stormssh
        - jsondiff
        - jmespath
        - pyyaml
        - lxml
        - requests
      requirements: "{{ inventory_dir }}/../requirements.yml"
      role: []
      collection:
        - community.docker
        - community.general
    workspace_param: "{{ workspace_optional | combine(workspace | default({},true), recursive=True) }}"
  run_once: true
  ansible.builtin.set_fact:
    _ws: "{{ workspace_param }}"

- name: seed-workspace.init|install system package
  become: true
  loop: "{{ _ws.package }}"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  register: package_install
  until: package_install is succeeded

- name: seed-workspace.init|retrieve info of pipx ansible-core
  community.general.pipx_info:
    executable: pipx
    name: ansible-core
    include_deps: true
    include_injected: true
    include_raw: true
  ignore_errors: true
  register: pipx_ansible

- name: seed-workspace.init|check ansible command does exist
  ansible.builtin.shell: realpath $(which ansible)
  ignore_errors: true
  changed_when: false
  register: which_ansible

- vars:
    bin_path_all: "{{ pipx_ansible.raw_output.venvs['ansible-core'].metadata.main_package.app_paths | map(attribute='__Path__') }}"
    bin_path_ansible: "{{ which_ansible.stdout_lines[0] }}"
    bin_path_dir: "{{ bin_path_ansible | dirname }}"
    bin_path_pip: "{{ [bin_path_dir,'pip'] | path_join }}"
    bin_path_python: "{{ [bin_path_dir,'python'] | path_join }}"
    py_path: "{{ pipx_ansible.raw_output.venvs['ansible-core'].metadata.source_interpreter['__Path__'] | default(bin_path_python,true) }}"
  when:
    - pipx_ansible is success
    - which_ansible is success
    - pipx_ansible.application | length > 0
    - which_ansible.stdout_lines | length > 0
    - which_ansible.stdout_lines[0] in bin_path_all
  block:

  - name: seed-workspace.init|create pip wrapper in pipx ansible-core
    become: true
    ansible.builtin.copy:
      dest: "{{ bin_path_pip }}"
      # fix chgrp failed: failed to look up group pipx
      owner: "{{ ansible_user_uid }}"
      group: "{{ ansible_user_gid }}"
      mode: u+rwx,g+rwx,o+rx
      content: |
        #!/bin/bash

        exec {{ bin_path_python }} -m pip $@

  - name: seed-workspace.init|fact pip virtualenv
    vars:
      ws_env:
        venv_path: "{{ bin_path_dir | dirname }}"
        venv_command: "{{ [bin_path_dir,'python'] | path_join }} -m venv"
        pip_executable: "{{ [bin_path_dir,'pip'] | path_join }}"
        python_interpreter: "{{ py_path }}"
    ansible.builtin.set_fact:
      _ws: "{{ _ws | combine(ws_env, recursive=True) }}"

- name: seed-workspace.init|custom interpreter|install python pip packages
  vars:
    ansible_python_interpreter: "{{ _ws.python_interpreter }}"
  loop: "{{ _ws.pip }}"
  when: "{{ _ws.python_interpreter | default(None,true) != None }}"
  ansible.builtin.pip:
    name: "{{ item }}"
    state: latest
    # executable: "{{ _ws.pip_executable }}"
    virtualenv: "{{ _ws.venv_path | default(omit,true) }}"
    virtualenv_command: "{{ _ws.venv_command | default(omit,true) }}"
  register: pip_install
  until: pip_install is succeeded

- name: seed-workspace.init|default interpreter|install python pip packages
  loop: "{{ _ws.pip }}"
  when: "{{ _ws.python_interpreter | default(None,true) == None }}"
  ansible.builtin.pip:
    name: "{{ item }}"
    state: latest
    # executable: "{{ _ws.pip_executable }}"
    virtualenv: "{{ _ws.venv_path | default(omit,true) }}"
    virtualenv_command: "{{ _ws.venv_command | default(omit,true) }}"
  register: pip_install
  until: pip_install is succeeded

- name: seed-workspace.init|stat ansible requirements
  ansible.builtin.stat:
    path: "{{ _ws.requirements }}"
  register: requirements_stat

- name: seed-workspace.init|install ansible requirements
  when: requirements_stat.stat.exists
  community.general.ansible_galaxy_install:
    type: both
    requirements_file: "{{ requirements_stat.stat.path }}"
  register: requirements_install
  until: requirements_install is succeeded

- name: seed-workspace.init|install ansible loop
  when: not requirements_stat.stat.exists
  vars:
    values_role: "{{ ['role'] | product(_ws.role) }}"
    values_collection: "{{ ['collection'] | product(_ws.collection) }}"
    values_all: "{{ values_role + values_collection }}"
    item_param: "{{ dict(['type', 'name'] | zip(item)) }}"
  loop: "{{ values_all }}"
  community.general.ansible_galaxy_install:
    type: "{{ item_param.type }}"
    name: "{{ item_param.name }}"
  register: galaxy_install
  until: galaxy_install is succeeded

- name: seed-workspace.init|unfact param
  run_once: true
  ansible.builtin.set_fact:
    _ws: !!null
